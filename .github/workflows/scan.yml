name: Copy-trade scan

# Vercel's free plan only runs cron jobs once a day, so this calls the scan
# endpoint every five minutes instead. Needs two repository secrets:
#   APP_URL      e.g. https://your-app.vercel.app
#   CRON_SECRET  the same value set in the Vercel project
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Trigger scan
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 300 \
            -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/scan"
